# Example configuration. Every key is optional; unspecified sections keep
# defaults, and every value shown here IS the default. Use with:
#   gpagent record -c gpagent.example.toml
#   gpagent commentate -c gpagent.example.toml
# Anything here can also be set ad hoc:  --set screen.long_edge=1280
#
# [gamepad] [audio] [screen] [triggers] are Component A (capture).
# [agent] [speak] are Component B (the commentary agent).

[gamepad]
window_ms = 500        # aggregation window
# off = movement never drives a screen capture (default);
# intensity = sticks feed the activity scalar; full = also described in summaries
sticks_mode = "off"
deadzone = 0.12        # our own; device-reported `flat` is far too small
tap_max_ms = 220       # longer presses count as holds, not taps

# Relabel buttons on pads that do not follow the Linux gamepad spec. Keys are
# kernel codes as printed by `gpagent monitor` (BTN_NORTH, or 0x133).
# [gamepad.button_map]
# BTN_NORTH = "X"
# BTN_WEST = "Y"

# The same, for one device only. Key is vid:pid from `gpagent devices`.
# [gamepad.device_button_map."2dc8:200f"]
# BTN_NORTH = "X"
# BTN_WEST = "Y"

[audio]
vad_backend = "silero" # silero | webrtc
vad_threshold = 0.5
preroll_ms = 300       # audio kept from before speech onset
hangover_ms = 500      # audio kept after speech ends
min_speech_ms = 250    # drops coughs and clicks
echo_cancel = true     # reference is the default sink's monitor
noise_suppression_level = "moderate"   # low | moderate | high | very-high
# Leave at moderate. Higher levels "trade off double-talk performance", and
# talking over game audio IS double-talk -- "high" suppresses you along with
# the echo. Raise only if game audio leaks into captured segments.
echo_suppression_level = "moderate"    # low | moderate | high

[screen]
long_edge = 1024       # 1280 for readable HUD text, 640 to save tokens
jpeg_quality = 75
pipeline_fps = 2       # constant cheap rate into the latest-frame holder

[triggers]
# Global floor between frames, binding on EVERY trigger: the per-trigger
# throttles below only limit their own kind, so without this the triggers take
# turns and the combined rate far exceeds any of them.
#
# This is a FRESHNESS knob, not a cost knob. The agent sends at most one frame
# per response and only if it is newer than the last one sent, so extra frames
# cost local JPEG encoding and nothing on the bill. What this controls is how
# stale the screenshot is when the agent comments.
min_interval_s = 2.0
heartbeat_s = 3.0          # the metronome; scene only fires on real transitions
gamepad_intensity = 0.35   # a held trigger reads 0.44, three taps in a window 0.40
gamepad_throttle_s = 2.0   # leading-edge throttle, not a debounce
scene_threshold = 0.06     # change since the PREVIOUS SAMPLE, not the last sent
scene_throttle_s = 3.0
dedup_threshold = 0.01     # drop frames too similar to the last one SENT

[agent]
model = "gpt-realtime-2.1-mini"   # -mini for testing; gpt-realtime-2.1 for real

# voice | text. Session-wide, because it IS output_modalities on session.update:
# in "text" the model writes the remark instead of speaking it, it arrives on
# response.output_text.* rather than as audio plus a transcript, and it lands on
# the [hud] overlay (which `commentate --text` turns on for you) instead of the
# speakers. Nothing about the input side changes -- the player still talks, is
# still transcribed, and still gets answered. Barge-in stops applying: text on
# screen is not talking over anyone. Text output is also roughly 10x cheaper per
# response than the same remark spoken.
output = "voice"
# alloy | ash | ballad | cedar | coral | echo | marin | sage | shimmer | verse
voice = "marin"
voice_speed = 1.0          # playback rate; server clamps to [0.25, 1.5]

# minimal | low | medium | high | xhigh. Only sent to reasoning-capable
# Realtime models (the gpt-realtime-2 family, including gpt-realtime-2.1 and
# -2.1-mini); unset omits the field and leaves it at the server default.
# reasoning_effort = "medium"

# ISO-639-1 code the player speaks and the agent answers in, e.g. "ja".
# Unset means the model follows whatever it hears. Passed to input
# transcription (where it improves accuracy) and named in the instructions,
# since the API has no output-language parameter.
# language = "ja"

# Template for the output-language directive appended when `language` is set.
# `{name}` is substituted with the resolved language name. Unset uses the
# built-in sentence (see agent/persona.py).
# language_directive = "\nSpeak {name} at all times."

# Replace the built-in persona (see agent/persona.py). `persona` wins over
# `persona_file`. Write it in English whatever `language` is set to: it is
# instructions to the model, not something anyone hears.
# persona_file = "~/.config/gpagent/persona.txt"

# Override for the note appended to the persona when output = "text" (see
# agent/persona.py::TEXT_OUTPUT_NOTE). Unset uses the built-in note.
# text_output_note = "\nKeep it to one short line."

# Per-reason overrides for the per-turn nudge sent before every
# response.create (see agent/persona.py::RESPONSE_INSTRUCTIONS). Any reason
# left out keeps its built-in text.
# [agent.reason_instructions]
# reply = "They just said something to you. Answer it, briefly."
# react = "Something just happened. One short reaction."
# ambient = "It has been quiet for a while. One short, low-stakes remark."

# Prefix the per-turn nudge above is wrapped in.
# reason_note_prefix = "Right now: "

# Template for the note sent ahead of trail images, ordering them for the
# model (see agent/session.py::Session._context_item). `{n}`, `{frame_word}`
# ("frame"/"frames") and `{span}` are substituted. Unset uses the built-in
# sentence.
# trail_note_template = "[screen] {n} earlier {frame_word} from the last {span:.0f}s, oldest first, then the current screen last."

# high is ~765 tokens for a 1024x576 frame, low a flat 85. Measured over 151 s
# of play, low saves about 15% of the *total* bill -- less than it looks, since
# output audio is the largest line -- and remarks get vaguer, reacting to tone
# rather than to the screen.
image_detail = "high"

# Earlier frames sent alongside the current one, at image_trail_detail, oldest
# first. One screenshot says where the player is and nothing about where they
# came from; capture triggers frames far faster than the agent speaks, so these
# are frames already taken and otherwise thrown away. Picked for spread across
# the window and for scene_score inside it, drawn only from the gap between the
# last frame sent and the current one (see context.ContextBuffer._pick_trail).
# On sess7: 225 trail frames over 68 turns, +$0.10 of fresh input on a $0.53 hour.
#
# Kept single-digit for TPM, not for price: a trail stays in history and is
# re-sent every turn after it, and input per request is already ~10.5k tokens by
# minute 60 (sess7 lost two responses to rate_limit). 0 disables.
image_trail = 4
image_trail_detail = "low"
# Minimum spacing between images sent in one turn. Bucketing spreads picks
# across the candidate window but never asks whether that window is worth
# spreading: back-to-back replies can leave two seconds, and four frames of the
# same two seconds is one moment sent four times. Below capture's own
# triggers.min_interval_s (2.0), so it is inert at default settings -- it is
# here so the agent does not lean on a capture-side knob to stay correct.
image_trail_min_gap_s = 1.5
image_trail_max_age_s = 45.0  # looser than max_image_age_s: stale is fine as history

max_image_age_s = 20.0        # never attach a screenshot older than this
image_on_unprompted = true    # attach frames to remarks, not just replies
max_output_tokens = 320       # backstop against rambling; hitting it truncates

# Client-side context trimming, both OFF because it was measured and it lost:
# the API re-bills the whole conversation each turn, so trimming looks like an
# obvious win, but deleting an item invalidates the prompt-cache prefix behind
# it and cached input is ~10x cheaper. Keeping every image billed 31008 image
# tokens for $0.0204; keeping the last two billed 8721 for $0.0268. The
# server's truncation_retention_ratio is the mechanism that belongs here.
prune_after_s = 0.0           # 0 leaves it to the server
keep_images = 0               # 0 for unlimited
truncation_retention_ratio = 0.8

transcribe_player = true      # readable logs, at a small per-minute cost
transcribe_model = "gpt-4o-mini-transcribe"

playback = true
# Must not name a device: the echo canceller references the DEFAULT sink's
# monitor, and playing anywhere else means the agent hears and answers itself.
# pipewiresink is rank 0 with no ring buffer and garbles speech; autoaudiosink
# picks pulsesink, which is built for streamed audio.
audio_sink = "autoaudiosink"
volume = 1.0                  # linear gain, applied by a gst volume element; 0 is silent

[speak]
# When the agent is allowed to talk. Three reasons -- reply, react, ambient --
# under one global cap. Per-reason rules alone compose badly and take turns.

max_per_min = 6.0        # global ceiling over a sliding minute, binds EVERY reason
min_gap_s = 8.0          # quiet floor after speaking; binds the unprompted reasons

# `reply` is exempt from the quiet floor -- refusing to answer a direct question
# is worse than being chatty -- so these two are what stop a player who talks
# continuously from pulling back-to-back answers. Does not apply after a
# barge-in: someone who cut you off is not asking you to pause first.
reply_min_gap_s = 3.0    # measured from the END of the last response
reply_ttl_s = 8.0        # answering nine seconds late is worse than not answering
max_reply_audio_ms = 20000

# react: something happened
scene_threshold = 0.35
intensity_threshold = 0.6
burst_windows = 2        # consecutive hot windows before that counts as a burst
event_cooldown_s = 30.0

# ambient: nothing happened
ambient_after_s = 75.0
ambient_requires_activity = true   # do not chat at a paused game in an empty room
ambient_idle_horizon_s = 45.0

# Cooldowns adapt: every unprompted remark the player ignores multiplies them,
# talking to the agent shrinks them. An agent being ignored gets quieter.
backoff_factor = 1.6
backoff_max = 3
engagement_boost = 0.6
engagement_window_s = 60.0

# Deadlock guards. Both gates are absolute while set, so a gate that sticks is
# a permanently mute agent -- the quietest possible bug to notice.
speech_gate_timeout_s = 31.0     # a speech.start whose segment never arrives
response_gate_timeout_s = 45.0   # a response that never completes

[hud]
# On-screen commentary: a stack of toasts in a corner, for when the agent
# should be read rather than heard. An override-redirect X11 window --
# XWayland on a Wayland session, deliberately, because that is mutter's
# topmost layer and Wayland offers a plain client nothing like it. Drive it on
# its own with `gpagent hud --demo`.
#
# agent.output = "text" turns this on regardless: it is that session's output
# device. read_cps below is then load-bearing beyond the display -- how long a
# remark is on screen is how long the speak policy treats it as still standing.
enabled = false

anchor = "top-right"     # top|bottom + -left|-right, or bare top|bottom to centre
# Which monitor: "primary", an output name ("HDMI-1"), or an index. The X
# screen is the UNION of the outputs, so "the top right of the screen" is off
# the side of a display unless one is named.
monitor = "primary"
margin_px = 32
width_frac = 0.28        # card width as a fraction of that monitor
min_width_px = 320

# HiDPI. Every *_px here is a design pixel at 96 dpi, multiplied by this.
# 0 discovers it: Xft.dpi from the X resource manager (what the compositor
# tells clients), else the monitor's physical dpi. XWayland reports device
# pixels, so at 2x an unscaled card is half the size it should be.
scale = 0.0

# Resolved through fontconfig, so a generic family works. Pillow does NO font
# fallback -- one file renders the whole card and DejaVu Sans has no CJK -- so
# a Japanese session needs font_lang, or every glyph comes out as tofu.
font_family = "sans-serif"
font_lang = ""           # e.g. "ja"; passed to fc-match as :lang=
# font_path = "/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc"
font_size_px = 22
line_spacing = 1.25
padding_px = 14
corner_radius_px = 14

max_entries = 3          # older remarks drop off the top rather than piling up
# Hold time is reading time, not a constant: an aside and an explanation should
# not be on screen for the same length of time.
read_cps = 16.0
hold_min_s = 4.0
hold_max_s = 16.0
fade_ms = 250            # fade-out at the end of a hold; 0 for a hard cut

# "card" is the panel below, with an accent bar and rules between entries.
# "stroked" is borderless -- no panel, no accent bar, no rules -- just text
# outlined in bg_color, for a game whose own HUD a translucent box competes with.
style = "card"
stroke_width_px = 2      # outline width for "stroked"; ignored by "card"

bg_color = "#12141a"
bg_opacity = 0.82        # real translucency, from a 32-bit ARGB visual;
                         # also the outline colour in "stroked"
fg_color = "#f2f4f8"
accent_color = "#6fd3ff" # the bar marking the newest remark ("card" only)
dim_older = 0.55         # alpha multiplier for everything that is not newest

# Off means the HUD eats every click that lands on it, which during a game is a
# bug. It exists for finding out where the window actually is.
click_through = true
# display = ":0"         # unset follows $DISPLAY
