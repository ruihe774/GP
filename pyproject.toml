[project]
name = "gpagent"
version = "0.1.0"
description = "Gameplay capture and discretization for a realtime LLM commentator (Component A)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pillow>=11.0",
    # Component B: the realtime session. The `realtime` extra pulls in the
    # websocket transport; `client.realtime.connect` is GA, not beta, as of 2.x.
    "openai[realtime]>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
gpagent = "gpagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "hardware: touches real devices (gamepad/mic/screen); deselected by default",
    "network: talks to the OpenAI API and spends money; deselected by default",
]
addopts = "-m 'not hardware and not network'"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM115",  # long-lived file handles opened in start()/open(), closed in a paired close()
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
